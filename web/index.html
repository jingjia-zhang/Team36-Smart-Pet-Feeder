<!DOCTYPE html>
<html>

<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Feeding System</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configure Tailwind custom colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2ecc71',
            success: '#27ae60',
            warning: '#e74c3c',
            surface: '#ffffff',
            background: '#f8f9fa',
            'text-primary': '#2d3436',
            'text-secondary': '#636e72',
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'md': '0 4px 6px -1px rgba(0, 0, 0, 0.1)',
          },
          borderRadius: {
            'lg': '12px',
          }
        },
      }
    }
  </script>

  <!-- Custom utility classes -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .status-card-hover {
        @apply transition-transform duration-200 hover:-translate-y-1;
      }
      .action-btn-hover {
        @apply transition-all duration-200 hover:opacity-90 hover:-translate-y-1;
      }
      .pulse-animation {
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.3);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(231, 76, 60, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
        }
      }
    }
  </style>
</head>

<body class="bg-background text-text-primary font-inter p-6">
<div id="modeIndicator" class="fixed top-6 right-6 px-4 py-2 rounded-full bg-primary/10 text-primary font-semibold flex items-center gap-2 transition-all duration-300">
  <i class="fas fa-satellite-dish"></i>
  <span>Remote Mode</span>
</div>

<div class="container mx-auto max-w-7xl p-4 min-h-[calc(100vh-3rem)]">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left video and chart area -->
    <div class="lg:col-span-2 space-y-6">
      <!-- Video container -->
      <div class="bg-black rounded-lg shadow-md overflow-hidden transition-transform duration-300 max-h-[450px]">
        <video id="videoElement" class="w-full h-full object-cover" controls autoplay playsinline></video>
      </div>

      <!-- Chart container -->
      <div class="bg-surface rounded-lg shadow-md p-6 h-[400px]">
        <div id="weightChart" class="w-full h-full"></div>
      </div>
    </div>

    <!-- Right control panel -->
    <div class="bg-surface rounded-lg shadow-md p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Working mode status card -->
        <div class="bg-background p-4 rounded-lg border-l-4 border-primary status-card-hover">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
              <i class="fas fa-cogs"></i>
            </div>
            <div>
              <div class="text-sm text-text-secondary font-medium">Working Mode</div>
              <div class="text-lg font-semibold" id="modeStatus">Remote</div>
            </div>
          </div>
        </div>

        <!-- Pet detection status card -->
        <div class="bg-background p-4 rounded-lg border-l-4 border-primary status-card-hover">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
              <i class="fas fa-paw"></i>
            </div>
            <div>
              <div class="text-sm text-text-secondary font-medium">Pet Detection</div>
              <div class="text-lg font-semibold" id="animalStatus">Not Detected</div>
            </div>
          </div>
        </div>

        <!-- Weight status card -->
        <div class="bg-background p-4 rounded-lg border-l-4 border-primary status-card-hover">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
              <i class="fas fa-weight-hanging"></i>
            </div>
            <div>
              <div class="text-sm text-text-secondary font-medium">Current Weight</div>
              <div class="text-lg font-semibold flex items-center">
                <span id="weightValue">0.00 g</span>
                <div id="weightIndicator" class="ml-2 w-3 h-3 rounded-full bg-gray-300"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Weight threshold setting card -->
        <div class="bg-background p-4 rounded-lg border-l-4 border-primary status-card-hover">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
              <i class="fas fa-balance-scale"></i>
            </div>
            <div>
              <div class="text-sm text-text-secondary font-medium">Weight Threshold</div>
              <input type="number" id="weightThreshold" value="100" class="w-24 px-3 py-2 border-2 border-gray-200 rounded-lg font-medium text-center focus:border-primary focus:outline-none">
            </div>
          </div>
        </div>

        <!-- Pump status card -->
        <div class="bg-background p-4 rounded-lg border-l-4 border-primary status-card-hover">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
              <i class="fas fa-tint"></i>
            </div>
            <div>
              <div class="text-sm text-text-secondary font-medium">Pump Status</div>
              <div class="text-lg font-semibold" id="pumpStatus">Closed</div>
            </div>
          </div>
        </div>

        <!-- Servo status card -->
        <div class="bg-background p-4 rounded-lg border-l-4 border-primary status-card-hover">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
              <i class="fas fa-cog"></i>
            </div>
            <div>
              <div class="text-sm text-text-secondary font-medium">Servo Status</div>
              <div class="text-lg font-semibold" id="servoStatus">Closed</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Control button group -->
      <div class="grid grid-cols-2 gap-4">
        <button id="startStreamBtn" class="action-btn-hover bg-primary text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
          <i class="fas fa-play"></i>
          Start Stream
        </button>
        <button id="stopStreamBtn" class="action-btn-hover bg-primary text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
          <i class="fas fa-stop"></i>
          Stop Stream
        </button>
        <button class="action-btn-hover bg-primary text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
          <i class="fas fa-tint"></i>
          Toggle Pump
        </button>
        <button class="action-btn-hover bg-primary text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
          <i class="fas fa-cogs"></i>
          Toggle Servo
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script type="module">

  // Video stream control
  let videoRef = document.getElementById('videoElement');
  let conn = null;
  let ws = null;

  // Initialize WebSocket connection
  const initWebSocket = () => {
    const WS_URL = 'ws://localhost:8080/pet-feeder';
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      console.log('WebSocket connection successful');
    };

    ws.onerror = (err) => {
      console.error('WebSocket connection error:', err);
    };

    ws.onclose = () => {
      console.log('WebSocket connection closed');
      setTimeout(() => {
        initWebSocket();
      }, 3000);
    };

    ws.onmessage = (event) => {
      try {

        // Check if it is binary data (video frames)
        if (event.data instanceof Blob) {
          // Release old Blob URL
          if (videoRef.src.startsWith('blob:')) {
            URL.revokeObjectURL(videoRef.src);
          }
          videoRef.src = URL.createObjectURL(event.data);
          return;
        }
        const data = JSON.parse(event.data);
        console.log('Received message:', data);

        // Update UI
        updateUI(data);
      } catch (e) {
        console.error('Message parsing error:', e);
      }
    };
  };

  // Update UI interface
  const updateUI = (data) => {
    // Update working mode
    if (data.mode) {
      const modeText = data.mode === 'Auto' ? 'Auto Mode' : 'Remote Mode';
      document.getElementById('modeStatus').textContent = modeText;
      document.getElementById('modeIndicator').className = `fixed top-6 right-6 px-4 py-2 rounded-full ${
              data.mode === 'Auto' ? 'bg-yellow-100 text-yellow-600' : 'bg-primary/10 text-primary'
      } font-semibold flex items-center gap-2 transition-all duration-300`;
      document.getElementById('modeIndicator').innerHTML = `
          <i class="fas fa-${data.mode === 'Auto' ? 'cogs' : 'satellite-dish'}"></i>
          <span>${modeText}</span>
        `;
    }

    // Update pet detection status
    if (data.pet_detected !== undefined) {
      document.getElementById('animalStatus').textContent = data.pet_detected ? 'Detected' : 'Not Detected';
    }

    // Update weight data
    if (data.weight !== undefined) {
      const weightElement = document.getElementById('weightValue');
      const indicator = document.getElementById('weightIndicator');
      const threshold = parseInt(document.getElementById('weightThreshold').value);

      weightElement.textContent = `${data.weight.toFixed(2)} g`;

      // Update status indicator
      indicator.className = `ml-2 w-3 h-3 rounded-full ${
              data.weight < threshold ? 'bg-warning pulse-animation' : 'bg-success'
      }`;

      // Update chart
      updateWeightChart(data.weight);
    }

    // Update pump status
    if (data.pump_status !== undefined) {
      document.getElementById('pumpStatus').textContent = data.pump_status ? 'Running' : 'Closed';
    }

    // Update servo status
    if (data.servo_status !== undefined) {
      document.getElementById('servoStatus').textContent = data.servo_status ? 'Open' : 'Closed';
    }
  };

  // Video stream control function
  window.start = async function() {
    try {
      initWebSocket(); // Initialize WebSocket when starting the video
    } catch (err) {
      console.error('Failed to get video stream:', err);
    }
  };

  window.stop = function() {
    if (conn) {
      conn.terminate();
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
    }
  };

  // Device control function
  window.togglePump = function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      const currentStatus = document.getElementById('pumpStatus').textContent === 'Running';
      ws.send(JSON.stringify({
        command: 'toggle_pump',
        state: !currentStatus
      }));
    }
  };

  window.toggleServo = function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      const currentStatus = document.getElementById('servoStatus').textContent === 'Open';
      ws.send(JSON.stringify({
        command: 'toggle_servo',
        state: !currentStatus
      }));
    }
  };

  // Real-time weight chart
  let weightChart = null;
  let weightHistory = [];
  const MAX_DATA_POINTS = 20;

  // Initialize chart
  const initWeightChart = () => {
    try {
      const chartDom = document.getElementById('weightChart');
      if (!chartDom) throw new Error('Chart container not found');

      chartDom.style.width = '100%';
      chartDom.style.height = '100%';

      weightChart = echarts.init(chartDom);

      const option = {
        title: {
          text: 'Real-time Weight Monitoring',
          left: 'center',
          textStyle: {
            color: 'var(--text-primary)'
          }
        },
        tooltip: {
          trigger: 'axis',
          formatter: params => {
            const date = new Date(params[0].value[0]);
            return `${date.toLocaleTimeString()}<br/>Weight: ${params[0].value[1]}g`;
          }
        },
        xAxis: {
          type: 'time',
          boundaryGap: false,
          axisLabel: {
            formatter: value => new Date(value).toLocaleTimeString()
          }
        },
        yAxis: {
          type: 'value',
          name: 'Weight (g)',
          min: 0,
          max: 500
        },
        series: [{
          name: 'Weight',
          type: 'line',
          showSymbol: false,
          smooth: true,
          data: weightHistory,
          lineStyle: {
            color: 'var(--primary-color)'
          },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(46, 204, 113, 0.3)' },
              { offset: 1, color: 'rgba(46, 204, 113, 0)' }
            ])
          }
        }],
        grid: {
          left: '5%',
          right: '5%',
          bottom: '15%'
        }
      };

      weightChart.setOption(option);
      window.addEventListener('resize', () => weightChart.resize());

    } catch (error) {
      console.error('Chart initialization failed:', error);
    }
  };

  // Update chart data
  const updateWeightChart = (weight) => {
    try {
      if (!weightChart) {
        setTimeout(() => updateWeightChart(weight), 50);
        return;
      }

      const timestamp = Date.now();
      weightHistory.push([timestamp, weight]);

      if (weightHistory.length > MAX_DATA_POINTS) {
        weightHistory = weightHistory.slice(-MAX_DATA_POINTS);
      }

      weightChart.setOption({
        series: [{
          data: weightHistory
        }]
      });

    } catch (error) {
      console.error('Chart update failed:', error);
    }
  };

  // 发送获取历史记录命令
  function getHistory() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        command: "get_history",
        limit: 50
      }));
    }
  }

  // Send remote control commands
  function sendRemoteCommand(command) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        command: "remote_command",
        args: command
      }));
    }
  }

  // Send start/stop video stream command
  document.getElementById('startStreamBtn').addEventListener('click', function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({command: "start_stream"}));
    }
  });

  document.getElementById('stopStreamBtn').addEventListener('click', function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({command: "stop_stream"}));
    }
  });

  // Initialization
  document.addEventListener('DOMContentLoaded', initWeightChart);
  window.addEventListener('load', initWeightChart);
</script>
</body>

</html>
